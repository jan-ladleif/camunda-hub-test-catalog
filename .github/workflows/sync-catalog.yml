name: Sync Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync assets to the Camunda Hub Catalog
        env:
          # Client credentials — store these as repository secrets.
          CAMUNDA_CONSOLE_CLIENT_ID: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_ID }}
          CAMUNDA_CONSOLE_CLIENT_SECRET: ${{ secrets.CAMUNDA_CONSOLE_CLIENT_SECRET }}
          # SaaS values. For Self-Managed, replace these with your installation's
          # values and remove CAMUNDA_CONSOLE_OAUTH_AUDIENCE — Management Identity
          # adds the web-modeler-public-api audience to the token (see README.md).
          CAMUNDA_OAUTH_URL: ${{ secrets.CAMUNDA_OAUTH_URL }}
          CAMUNDA_CONSOLE_OAUTH_AUDIENCE: ${{ secrets.CAMUNDA_CONSOLE_OAUTH_AUDIENCE }}
          CAMUNDA_HUB_BASE_URL: ${{ secrets.CAMUNDA_HUB_BASE_URL }}
        run: bash scripts/sync-catalog.sh
